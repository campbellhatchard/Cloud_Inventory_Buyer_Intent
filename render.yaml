databases:
  - name: summitct-db
    plan: free
    databaseName: summitct
    user: summitct

services:
  - type: web
    name: summitct
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: summitct-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: ADMIN_USERNAME
        value: campbell.hatchard@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
